name: E7 B quality gate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      fail_demo:
        description: "Intentional failing oracle for the teaching demonstration"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: e7-b-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMAGE: e7-draft:ci
      FAIL_DEMO: ${{ inputs.fail_demo }}
    steps:
      - name: Check out the exact triggering revision
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare evidence and check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/ci
          git rev-parse HEAD > work/ci/commit.txt
          docker version > work/ci/docker-version.txt
          python3 -m compileall -q services/draft/draft scripts

      - name: Scan tracked sources and Git history
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/secret_scan.py . --history 2>&1 | tee work/ci/source-scan.log

      - name: Build the service image
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain -f services/draft/Dockerfile -t "$IMAGE" \
            --build-arg BASE_IMAGE=docker.io/library/python@sha256:f82c96458eedc847b233e582eb31336f4954b39cae020b6dcf5b3ed0e5cbcd74 \
            --build-arg DOCKER_CLI_IMAGE=docker.io/library/docker@sha256:9190b0613792e658a7783cf14b2d5ace5941bb68ede7276922ea36ee457d76ad \
            --build-arg DEBIAN_MIRROR=https://deb.debian.org \
            --build-arg PYPI_INDEX=https://pypi.org/simple . 2>&1 | tee work/ci/build.log
          docker image inspect "$IMAGE" > work/ci/service-image-inspect.json

      - name: Scan built image
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/secret_scan.py . --image "$IMAGE" 2>&1 | tee work/ci/image-scan.log

      - name: Run the real component and fault gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_e7_ci_inputs.py --out work/ci/inputs
          args=()
          if [[ "$FAIL_DEMO" == "true" ]]; then
            args+=(--case success --inject-bad-oracle)
          fi
          python3 scripts/run_e7_b_gate.py --image "$IMAGE" --fixture work/ci/inputs/fixture --candidate work/ci/inputs/candidate.Dockerfile --out work/ci/gate "${args[@]}" 2>&1 | tee work/ci/gate-console.log

      - name: Archive evidence even when checks fail
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e7-b-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
